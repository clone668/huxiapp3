:root {
  --bg:#f9fbf4; --card:#fffefa; --bd:#dedfd4; --ink:#2b3c34; --mute:#8a9180; --line:#bac7b2;
  --red:#315c48; --glass:#fffefa; --band:rgba(75,107,63,.042); --rule:rgba(138,158,116,.17);
  --dot:rgba(106,125,91,.19); --press:#edf1e5; --shadow:none;
  --accent:#a77850; --cs:22%; --cl:44%; --node-width:100px; --node-height:46px;
  --serif:"Noto Serif SC","Source Han Serif SC","Songti SC","STSong","SimSun",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
}
[data-theme=blue] {
  --bg:#ececdc; --card:#f6f6ec; --bd:#b9c1c7; --ink:#003399; --mute:#52658f; --line:#94a4be;
  --red:#003399; --glass:#ececdc; --band:rgba(0,51,153,.035); --rule:rgba(0,51,153,.15);
  --dot:rgba(0,51,153,.16); --press:#dfe3dc; --shadow:none;
  --accent:#003399;
}
* {box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body {margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--sans);overscroll-behavior:none;-webkit-text-size-adjust:100%}
button {font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;-webkit-appearance:none;appearance:none}
button:disabled {cursor:default;opacity:.34}
button:focus-visible,input:focus-visible {outline:2px solid var(--accent);outline-offset:4px}

/* Zoom is rendered as real geometry and font sizes, never as a stretched layer. */
#vp {position:fixed;inset:0;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;cursor:grab;
  background-image:radial-gradient(var(--dot) .65px,transparent .65px);background-size:20px 20px}
#vp.drag {cursor:grabbing}
#world {position:absolute;left:0;top:0;--k:1}
.band {position:absolute;pointer-events:none;border-left:1px dashed var(--rule)}
.band.on {background:var(--band)}
#links {position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
.lk {fill:none;stroke:var(--line);stroke-width:1.4;stroke-linecap:round}
.lk.hl {stroke:var(--red);stroke-width:2}
.lk.pop {animation:fade .25s ease-out}
@keyframes fade {from{opacity:0}}
.node {position:absolute;width:calc(var(--node-width) * var(--k));height:calc(var(--node-height) * var(--k));cursor:pointer;--c:hsl(var(--h),var(--cs),var(--cl))}
[data-theme=blue] .node {--c:#003399;--card:var(--bg)}
.card {position:absolute;inset:0;width:100%;height:100%;background:var(--card);color:var(--ink);border:1px solid var(--bd);
  border-radius:calc(10px * var(--k));box-shadow:var(--shadow);padding:calc(12px * var(--k)) calc(14px * var(--k));
  text-align:left;overflow:hidden;cursor:pointer;transition:border-color .15s,background .15s}
.card:before {content:"";position:absolute;top:calc(14px * var(--k));bottom:calc(14px * var(--k));left:0;
  width:calc(3px * var(--k));border-radius:0 3px 3px 0;background:var(--c);opacity:.5}
.card:hover {border-color:var(--c);background:var(--card)}
.pop .card {animation:fade .25s ease-out}
.nm {font:600 calc(18px * var(--k))/1.25 var(--serif);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:calc(.5px * var(--k))}
.sub {font:calc(11px * var(--k))/1.3 Georgia,"Times New Roman",serif;color:var(--mute);margin-top:calc(5px * var(--k));
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums;letter-spacing:calc(.5px * var(--k))}
.node.nosub .card {display:flex;align-items:center}
.node.path .card {border-color:#8da37e}
.node.sel .card {border-color:var(--red);box-shadow:0 0 0 2px var(--red)}
[data-theme=blue] .node.path .card {border-color:var(--line)}
[data-theme=blue] .node.sel .card {border-color:var(--red)}
.tog {position:absolute;right:calc(-12px * var(--k));top:50%;margin-top:calc(-12px * var(--k));width:calc(24px * var(--k));height:calc(24px * var(--k));
  border-radius:50%;padding:0;z-index:2;border:1px solid var(--bd);background:var(--press);color:var(--red);
  font:600 calc(10px * var(--k))/1 var(--sans);display:grid;place-items:center;box-shadow:0 2px 5px #25382208}
.tog.open {background:var(--card);color:var(--mute);font-size:calc(17px * var(--k));font-weight:400}
.tog:after {content:"";position:absolute;inset:-10px}
.tog:hover {border-color:var(--red)}

.overview .tog {display:none}
.overview .card {box-shadow:none}
.overview .lk {vector-effect:non-scaling-stroke;stroke-width:.8}
.overview .lk.hl {stroke-width:1.3}
.overview-mini .card {border:0;padding:0;background:var(--c);opacity:.85;box-shadow:none;border-radius:1px}
.overview-mini .card:before,.overview-mini .nm,.overview-mini .sub {display:none}
.overview-mini .node.sel .card {background:var(--red);box-shadow:0 0 0 1px var(--red)}
.edited-at {margin:0;color:var(--mute);font-size:11px;letter-spacing:.2px;line-height:1.5;font-variant-numeric:tabular-nums;white-space:nowrap}
#viewHint {position:fixed;left:50%;transform:translateX(-50%);z-index:16;pointer-events:none;border:1px solid var(--bd);
  background:var(--glass);color:var(--mute);font-size:10px;line-height:1.5;border-radius:20px;padding:6px 12px;white-space:nowrap}
#viewHint[hidden] {display:none}
#dock button.is-active {background:var(--press);color:var(--red)}
@media(max-width:600px){#viewHint {font-size:9px;padding:5px 10px}}

/* A compact header leaves the family tree as the main reading surface. */
#top {position:fixed;left:0;right:0;top:0;min-height:calc(env(safe-area-inset-top) + 66px);padding:calc(env(safe-area-inset-top) + 10px) 28px 10px;
  display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;align-items:center;gap:15px;background:var(--glass);border-bottom:1px solid var(--bd);z-index:20}
#top.hide-note {grid-template-columns:auto minmax(0,1fr) auto}
#top.hide-note .top-note {display:none}
.header-collapsed #top {display:none}
#seal {width:43px;height:47px;flex:none;border:1px solid var(--accent);border-radius:4px;color:var(--accent);
  font:500 29px/45px var(--serif);text-align:center;outline:1px solid var(--accent);outline-offset:-5px}
.ttl {min-width:0;display:flex;flex-direction:column;align-items:flex-start;gap:4px}
.ttl>* {max-width:100%}
.title-row {display:flex;align-items:baseline;gap:10px;min-width:0}
.title-row .edited-at {flex:none}
.ttl h1 {margin:0;font:600 23px/1.3 var(--serif);letter-spacing:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.ttl p {margin:0;font-size:14px;line-height:1.5;color:var(--mute);letter-spacing:.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-note {margin:0;color:var(--mute);font:14px/1.5 var(--serif);letter-spacing:2px;white-space:nowrap}
.ibtn {width:42px;height:42px;border-radius:12px;border:1px solid var(--bd);background:var(--card);display:grid;place-items:center;padding:0;flex:none}
.ibtn:hover {background:var(--press)}
.ibtn svg,#dock svg {width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
#cols {position:fixed;left:0;right:0;top:var(--header-height,66px);height:28px;overflow:hidden;pointer-events:none;z-index:15;
  background:var(--glass);border-bottom:1px solid var(--bd)}
#colLabels {position:absolute;inset:0 68px 0 0;overflow:hidden}
#headerToggle {position:absolute;right:0;top:0;width:68px;height:100%;padding:0 4px;border:0;border-left:1px solid var(--bd);
  background:inherit;color:var(--mute);font-size:10px;display:flex;align-items:center;justify-content:center;gap:3px;pointer-events:auto;white-space:nowrap}
#headerToggle:hover {background:var(--press);color:var(--ink)}
#headerToggle svg {width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.header-collapsed #headerToggle svg {transform:rotate(180deg)}
.col {position:absolute;left:0;top:50%;min-width:64px;text-align:center;padding:2px 10px;font:500 12px/1.3 var(--sans);
  letter-spacing:1px;border-radius:6px;color:var(--mute);white-space:nowrap}
.col:before {content:"";display:inline-block;width:4px;height:4px;background:var(--line);border-radius:50%;margin-right:7px;vertical-align:2px}
.col.on {background:var(--press);color:var(--red)}
.col.on:before {background:var(--red)}
#zoom {position:fixed;right:25px;bottom:calc(env(safe-area-inset-bottom) + 23px);display:flex;align-items:center;gap:0;z-index:19;
  padding:4px;background:var(--glass);border:1px solid var(--bd);border-radius:12px;box-shadow:var(--shadow)}
#zoom button {width:37px;height:39px;border-radius:8px;border:0;background:transparent;font-size:22px;line-height:1;padding:0;font-weight:300}
#zoom button:not(:disabled):hover {background:var(--press)}
#zoom .fullscreen {font-size:11px;font-weight:500;color:var(--red)}
#zoom .line-style {font-size:10px;font-weight:500;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--ink)}
#zoom .line-style svg {width:18px;height:12px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
#zoom .fullscreen[hidden] {display:none}
#zoomValue {font:12px var(--sans);color:var(--mute);text-align:center;width:47px;font-variant-numeric:tabular-nums}
#zoomValue:after {content:"全览–300%";display:block;font-size:8px;letter-spacing:.2px;margin-top:3px;opacity:.8}
#dock {position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 18px);width:min(calc(100% - 28px),430px);
  display:flex;padding:6px;background:var(--glass);border:1px solid var(--bd);border-radius:17px;box-shadow:0 8px 30px #263d2610;z-index:20}
#dock button {flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:5px;padding:9px 0 7px;
  font-size:11px;border-radius:11px;color:var(--mute);transition:background .15s,color .15s}
#dock button:first-child {background:var(--press);color:var(--red)}
#dock button:hover,#dock button:active {background:var(--press);color:var(--red)}
.canvas-note {position:fixed;left:28px;bottom:29px;z-index:10;pointer-events:none;color:var(--mute);font-size:10px;letter-spacing:1px;line-height:1.9}
.canvas-note strong {font:15px var(--serif);letter-spacing:2px;display:block;color:var(--ink);margin-bottom:6px;font-weight:400}

/* Search, generations and person details share the same reading panel. */
#mask {position:fixed;inset:0;background:#17291e50;opacity:0;pointer-events:none;transition:opacity .2s;z-index:30}
#mask.on {opacity:1;pointer-events:auto}
#sheet {position:fixed;left:50%;bottom:0;width:min(100%,560px);transform:translate(-50%,108%);background:var(--card);
  border:1px solid var(--bd);border-bottom:0;border-radius:24px 24px 0 0;box-shadow:0 -12px 55px #18352018;z-index:40;
  transition:transform .28s cubic-bezier(.2,.85,.25,1);max-height:80vh;max-height:80dvh;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom)}
#sheet.open {transform:translate(-50%,0)}
#sheet.peek {max-height:48vh;max-height:48dvh}
.grip {padding:11px 0 9px;touch-action:none;cursor:grab;flex:none}
.grip:before {content:"";display:block;width:34px;height:4px;border-radius:4px;background:var(--bd);margin:0 auto}
#sheetBody {overflow:auto;padding:7px 26px 25px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:var(--bd) transparent}
.sh-title {font:600 22px/1.4 var(--serif);letter-spacing:2px;margin:1px 0 16px}
.sh-head {display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.d-name {font:600 29px/1.3 var(--serif);letter-spacing:3px}
.tags {display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.tag {font-size:10px;padding:4px 8px;border-radius:5px;border:1px solid var(--bd);color:var(--mute)}
.tag[style] {border-color:transparent;color:var(--red);background:var(--press)}
.tag.red {color:var(--red);border-color:var(--red)}
.x {width:36px;height:36px;flex:none;border-radius:50%;border:0;background:var(--press);font-size:14px;padding:0;color:var(--mute)}
.x:hover {color:var(--red)}
.info {display:grid;grid-template-columns:auto 1fr;gap:11px 22px;margin:20px 0 3px;padding-top:17px;border-top:1px solid var(--bd);font-size:12px}
.info dt {color:var(--mute);padding-top:3px}
.info dd {margin:0;line-height:1.8;font-size:13px;overflow-wrap:anywhere}
.sec {margin:21px 0 11px;font-size:10px;color:var(--mute);letter-spacing:2px;display:flex;align-items:center;gap:12px}
.sec:after {content:"";flex:1;height:1px;background:var(--bd)}
.chips {display:flex;gap:6px;overflow-x:auto;padding:2px 0 7px;align-items:center;scrollbar-width:none}
.chips::-webkit-scrollbar {display:none}
.chips.wrap {flex-wrap:wrap;overflow:visible}

.chip:hover {border-color:var(--red)}
.chip.cur {border-color:var(--red);color:var(--red);background:var(--press)}
.arr {flex:none;color:var(--mute);font-size:12px}
.btns {display:flex;flex-wrap:wrap;gap:9px;margin-top:22px;padding-top:17px;border-top:1px solid var(--bd)}
.btn {flex:1;min-width:100px;padding:12px 10px;border-radius:8px;border:1px solid var(--bd);background:var(--bg);font-size:12px;font-weight:500}
.btn.pri {background:var(--red);border-color:var(--red);color:var(--card)}
.btn:active {opacity:.8}
#q {width:100%;padding:13px 15px;font:16px var(--sans);border-radius:9px;border:1px solid var(--bd);background:var(--bg);color:var(--ink);outline:none}
#q:focus {border-color:var(--red);box-shadow:0 0 0 3px var(--press)}
.hint {font-size:12px;color:var(--mute);line-height:1.9;margin:13px 2px}
.res {display:flex;width:100%;align-items:center;gap:13px;padding:15px 5px;border:0;border-bottom:1px solid var(--bd);background:none;text-align:left;border-radius:4px}
.res:hover {background:var(--press)}
.res b {font:600 17px var(--serif)}
.res span {font-size:10px;color:var(--mute)}
.res em {margin-left:auto;font:11px Georgia,serif;color:var(--mute);font-variant-numeric:tabular-nums}
.res mark {background:none;color:var(--red)}
.gg {display:grid;grid-template-columns:repeat(5,1fr);gap:9px;margin-top:13px}
.gg button {border:1px solid var(--bd);background:var(--bg);border-radius:9px;padding:12px 0 10px;display:flex;flex-direction:column;align-items:center;gap:3px}
.gg button:hover {border-color:var(--red)}
.gg small,.gg i {font-size:10px;color:var(--mute);font-style:normal}
.gg b {font:600 17px/1.6 var(--serif);color:var(--ink)}
.gg button.vis {border-color:#acba9e}
.gg button.cur {background:var(--red);border-color:var(--red)}
.gg button.cur small,.gg button.cur i,.gg button.cur b {color:var(--card)}
.gg button:disabled {opacity:.3}
#toast {position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 145px);transform:translate(-50%,-8px);background:#284632f2;color:#fffefa;
  padding:11px 18px;border-radius:9px;font-size:12px;line-height:1.7;opacity:0;transition:.2s;pointer-events:none;z-index:60;max-width:88%;text-align:center;
  box-shadow:0 7px 20px #16351a15}
#toast.on {opacity:1;transform:translate(-50%,0)}
[data-theme=blue] .gg button.vis {border-color:var(--line)}
[data-theme=blue] .gg button.cur {border-color:var(--red)}
[data-theme=blue] #mask {background:#00226650}
[data-theme=blue] #toast {background:var(--red);color:var(--bg)}
[data-theme=blue] :is(#top,#cols) {background:var(--card)}
@media(max-width:850px) {
  #top {padding-left:20px;padding-right:20px}.canvas-note {display:none}
  #zoom {bottom:calc(env(safe-area-inset-bottom) + 107px);right:17px;flex-direction:column;padding:3px;border-radius:12px}
  #zoom button {width:42px;height:40px}#zoomValue {width:42px;padding:6px 0;font-size:11px}
  #zoomValue:after {display:none}
}
@media(max-width:600px) {
  #top {min-height:calc(env(safe-area-inset-top) + 60px);padding-left:12px;padding-right:12px;gap:10px}
  #seal {width:37px;height:42px;font-size:25px;line-height:40px}
  .ttl h1 {font-size:20px;letter-spacing:1.5px}.ttl p {font-size:12px;letter-spacing:0}
  .top-note {font-size:12px;letter-spacing:1px}
  .ibtn {width:40px;height:40px;border-radius:10px}
  #cols {height:24px}.col {font-size:10px;padding:2px 7px;min-width:58px}
  #dock {bottom:calc(env(safe-area-inset-bottom) + 13px);padding:5px;width:calc(100% - 28px);max-width:430px;border-radius:16px}
  #dock button {padding:10px 0 8px;gap:5px;font-size:10px}#dock svg {width:21px;height:21px}
  #sheetBody {padding:6px 21px 22px}.sh-title {font-size:21px}.d-name {font-size:27px}
  .gg {gap:7px}.gg button {padding:10px 0 9px}.gg b {font-size:15px}.res {gap:10px}
  #toast {top:calc(env(safe-area-inset-top) + 133px);font-size:11px;max-width:90%}
}
@media(max-width:350px) {.ttl h1 {font-size:19px}.ttl p {font-size:12px}.gg {gap:5px}.gg b {font-size:14px}}
@media(max-height:500px) and (orientation:landscape) {
  #top {min-height:58px}#cols {height:24px}
  #dock {width:310px;padding:3px;bottom:8px}#dock button {flex-direction:row;justify-content:center;padding:10px 0;font-size:10px}
  #zoom {bottom:8px;flex-direction:row;right:10px}#zoom button {width:32px;height:33px}#zoomValue {width:38px}
  .canvas-note {display:none}#toast {top:107px}
}
/* Both themes share compact geometry; only the blue theme uses square controls. */
[data-theme=blue] :is(button,input,#seal,#zoom,#dock,#sheet,#viewHint,#toast,.col,.tag,.chip) {border-radius:0}
[data-theme=blue] :is(.card,.col,.grip):before {border-radius:0}
[data-theme] :is(#dock,#sheet,#toast,.tog) {box-shadow:none}
[data-theme] .card {padding:calc(4px * var(--k)) calc(8px * var(--k))}
[data-theme] .card:before {top:calc(8px * var(--k));bottom:calc(8px * var(--k));width:calc(2px * var(--k))}
[data-theme] .nm {font-size:calc(17px * var(--k));line-height:1.2}
[data-theme=blue] :is(.nm,.d-name,.chip,.res b,.person-name) {font-family:"ZupuKai","KaiTi","楷体","STKaiti","Kaiti SC",serif;font-weight:400}
[data-theme] .sub {font-size:calc(10px * var(--k));margin-top:calc(2px * var(--k))}
[data-theme] .overview-mini .card {padding:0}
[data-theme] #top {padding-top:calc(env(safe-area-inset-top) + 8px);padding-bottom:8px}
[data-theme] #dock {width:min(calc(100% - 24px),390px);padding:3px}
[data-theme] #dock button {min-height:44px;flex-direction:row;justify-content:center;gap:4px;padding:6px 3px;font-size:11px}
[data-theme] #dock svg {width:18px;height:18px}
[data-theme] #sheetBody {padding:6px 20px 18px}
[data-theme] .info {gap:8px 16px;margin-top:16px;padding-top:13px}
[data-theme] .sec {margin:16px 0 9px}
[data-theme] .chip {padding:8px 10px}
[data-theme] .res {padding:11px 5px}
[data-theme] #toast {top:calc(var(--header-height,66px) + 58px)}
@media(max-width:850px) {[data-theme] #zoom {bottom:calc(env(safe-area-inset-bottom) + 86px)}}
@media(max-width:600px) {[data-theme] #top {padding-left:12px;padding-right:12px;gap:6px 10px}}
@media(max-height:500px) and (orientation:landscape) {[data-theme] #dock {width:310px}[data-theme] #zoom {bottom:8px}}
@media(max-width:700px) and (max-height:500px) and (orientation:landscape) {[data-theme] #zoom {bottom:calc(env(safe-area-inset-bottom) + 70px)}}
@media(prefers-reduced-motion:reduce) {.pop .card,.lk.pop {animation:none}#sheet,#toast {transition:none}}
.info dd{white-space:pre-wrap;overflow-wrap:anywhere}
.female .nm{display:flex;align-items:center;gap:calc(3px * var(--k));width:100%}
.female .name-text{min-width:0;overflow:hidden;text-overflow:ellipsis;letter-spacing:0}
.gender-mark{flex:none;color:#944c45;font:500 calc(10px * var(--k))/1.2 var(--sans);letter-spacing:0}
.overview-mini .female .nm{display:none}
[data-theme] .node-note{font-family:var(--serif);font-size:calc(11px * var(--k));line-height:1.2;letter-spacing:0;color:var(--c)}
[data-theme=blue] .node-note{font-family:"ZupuKai","KaiTi","楷体","STKaiti","Kaiti SC",serif}
</style>

spouse":"","bio":"","note":"","gender":"男"},{"id":"p-8f0ca889-a5b8-43fe-9b6a-6b2f2c86705f","parentId":"p-45ac3c8f-488f-49d1-80b5-9a243f3f50bb","name":"继龙","years":"","spouse":"","bio":"","note":"","gender":"男"},{"id":"p-1f0ef675-1f3e-4f5b-baa2-aeb0c5b1d395","parentId":"p-45ac3c8f-488f-49d1-80b5-9a243f3f50bb","name":"双龙","years":"","spouse":"","bio":"","note":"","gender":"男"},{"id":"p-e2e6f860-43b8-41e2-859e-692c69fd7c5f","parentId":"p-a174b27f-6b13-424f-9ac8-fe486d445dba","name":"炳钦","years":"","spouse":"","bio":"","note":"","gender":"男"},{"id":"p-53040438-96cb-4e7f-81cc-fc3153bf6df2","parentId":"p-e2e6f860-43b8-41e2-859e-692c69fd7c5f","name":"事停","years":"","spouse":"","bio":"","note":"","gender":"男"},{"id":"p-071794eb-4870-4460-8405-26ce70310913","parentId":"p-edda8ab0-1a12-4a2e-b598-2ab6cee9421f","name":"协连公","years":"","spouse":"","bio":"","note":"","gender":"男"},{"id":"p-d135fec6-9969-42d2-85d2-e991aa9ee369","parentId":"p-071794eb-4870-4460-8405-26ce70310913","name":"水金","years":"","spouse":"","bio":"","note":"移居晋江","gender":"男"},{"id":"p-459ad120-923c-47d4-bb3a-65a4d2a4cdf6","parentId":"p-edda8ab0-1a12-4a2e-b598-2ab6cee9421f","name":"协箝公","years":"","spouse":"","bio":"","note":"","gender":"男"},{"id":"p-a4a00f20-697c-4b87-8a77-2698ede9a405","parentId":"p-459ad120-923c-47d4-bb3a-65a4d2a4cdf6","name":"金发","years":"","spouse":"","bio":"","note":"移居晋江","gender":"男"},{"id":"p-95aa0020-dc17-4e3a-9b02-e50aebf604d5","parentId":"p-edda8ab0-1a12-4a2e-b598-2ab6cee9421f","name":"廷水公","years":"","spouse":"","bio":"","note":"","gender":"男"},{"id":"p-9e127df8-7f03-4a9b-b496-02b7a2827edf","parentId":"p-95aa0020-dc17-4e3a-9b02-e50aebf604d5","name":"金海君","years":"","spouse":"","bio":"","note":"","gender":"男"},{"id":"p-93d773b7-68cb-40a9-9c15-a37bb2befd8c","parentId":"p-95aa0020-dc17-4e3a-9b02-e50aebf604d5","name":"仙桐君","years":"","spouse":"","bio":"","note":"","gender":"男"},{"id":"p-1fe9e828-64cd-4d11-89eb-a042150b6526","parentId":"p-95aa0020-dc17-4e3a-9b02-e50aebf604d5","name":"仙财君","years":"","spouse":"","bio":"","note":"","gender":"男"},{"id":"p-a9b674e3-8343-406e-af6d-ffb9069264a5","parentId":"p-1fe9e828-64cd-4d11-89eb-a042150b6526","name":"桂枝","years":"","spouse":"","bio":"","note":"兼祀","gender":"男"},{"id":"p-4c9cc0b0-a822-40da-a458-36f71af1bb9c","parentId":"p-17301606-f9e7-48e3-a998-2fef44ba0d0b","name":"显明公","years":"","spouse":"","bio":"","note":"分七间张刊","gender":"男"}]}</script>

<script>
(()=>{
'use strict';
/* ================= 常量与工具 ================= */
const NW=100,NH=46,GX=40,PITCH=NW+GX,GY=16;
const READ_MIN=.75,MAX_ZOOM=3;
// The file's edit time (Asia/Shanghai), not the time somebody opens this page.
const FAMILY=JSON.parse(document.getElementById('familyData').textContent);
const LAST_EDITED=FAMILY.meta.editedAt;
const TOP_ALIGNED=FAMILY.meta.branchLayout==='top';
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cn=n=>{const d='零一二三四五六七八九';if(n<=10)return n===10?'十':d[n];if(n<20)return'十'+d[n-10];const t=Math.floor(n/10),o=n%10;return d[t]+'十'+(o?d[o]:'')};
const hue=d=>[108,130,91,148,76][d%5];
const LS={get(k){try{return localStorage.getItem(FAMILY.id+':'+k)}catch(e){return null}},set(k,v){try{localStorage.setItem(FAMILY.id+':'+k,v)}catch(e){}}};
const DEFAULT_LINE_STYLE=FAMILY.meta.lineStyle||'straight';
let lineStyle=DEFAULT_LINE_STYLE;
const fmtYears=s=>s?s.replace(/\s*[-~—–]\s*/,'–'):'';
const minZoom=()=>Math.min(READ_MIN,overviewGeometry().k);
const clampK=k=>Math.min(MAX_ZOOM,Math.max(minZoom(),Number.isFinite(k)?k:1));
const pixel=v=>Math.round(v*(devicePixelRatio||1))/(devicePixelRatio||1);

const vp=$('#vp'),world=$('#world'),bandsEl=$('#bands'),linksEl=$('#links'),nodesEl=$('#nodes'),
  cols=$('#cols'),colLabels=$('#colLabels'),dock=$('#dock'),sheet=$('#sheet'),body=$('#sheetBody'),mask=$('#mask'),toastEl=$('#toast');

let measuredHeaderHeight=0;
function measureHeader(){
  const header=$('#top');
  if(document.documentElement.classList.contains('header-collapsed')){
    const changed=measuredHeaderHeight!==0;measuredHeaderHeight=0;
    document.documentElement.style.setProperty('--header-height','env(safe-area-inset-top, 0px)');
    return changed;
  }
  // Measure the single-row layout before deciding whether its optional motto fits.
  header.classList.remove('hide-note');
  const style=getComputedStyle(header),row=header.querySelector('.title-row');
  const titleWidth=$('#ttl').scrollWidth+$('#editedAt').getBoundingClientRect().width+parseFloat(getComputedStyle(row).columnGap);
  const textWidth=Math.max(titleWidth,$('#sub').scrollWidth);
  const requiredWidth=parseFloat(style.paddingLeft)+parseFloat(style.paddingRight)+$('#seal').offsetWidth+$('#theme').offsetWidth+
    textWidth+header.querySelector('.top-note').offsetWidth+3*parseFloat(style.columnGap);
  header.classList.toggle('hide-note',requiredWidth>header.clientWidth);
  const h=Math.ceil(header.getBoundingClientRect().height);
  if(h===measuredHeaderHeight)return false;
  measuredHeaderHeight=h;document.documentElement.style.setProperty('--header-height',h+'px');return true;
}
function setHeaderHidden(hidden,remember=true){
  document.documentElement.classList.toggle('header-collapsed',hidden);
  const button=$('#headerToggle'),label=hidden?'展开顶部标题栏':'收起顶部标题栏';
  button.setAttribute('aria-expanded',String(!hidden));button.setAttribute('aria-label',label);button.title=label;
  $('#headerToggleText').textContent=hidden?'展开顶部':'收起顶部';
  if(remember)LS.set('zupu:header-hidden',hidden?'1':'0');
  measureHeader();stopMotion();
  if(nodes.length){if(overviewPinned)fitOverview(false);else apply();}
}
$('#headerToggle').addEventListener('click',()=>setHeaderHidden(!document.documentElement.classList.contains('header-collapsed')));

const ICON_EXPAND='<path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/>';
const ICON_COLLAPSE='<path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/>';
const ICON_SUN='<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg>';
const ICON_BOOK='<svg viewBox="0 0 24 24"><path d="M12 5C9 3 5 3 3 4v15c3-1 6-1 9 1 3-2 6-2 9-1V4c-2-1-6-1-9 1zM12 5v15M6 8h3M6 12h3M15 8h3M15 12h3"/></svg>';
const THEMES=[
  {id:'blue',name:'米色蓝字',color:'#ececdc',icon:ICON_BOOK},
  {id:'light',name:'浅色',color:'#f9fbf4',icon:ICON_SUN}
];

/* ================= 状态 ================= */
let meta,nodes=[],root,text='',totalGens=0,counts=[];
let expanded=new Set(),selected=null,curGen=-1,view={x:0,y:0,k:1};
let worldW=0,worldH=0,maxD=0,visible=[],sheetKind=null,overviewPinned=false;
const nodeEls=new Map(),linkEls=new Map(),colEls=[],bandEls=[];
const SAMPLE='';

/* ================= 解析 =================
 * #标题 xxx / #字辈 xxxxx
 * 每行一人：姓名｜生卒｜配偶｜简介　　缩进每 2 个空格 = 下一世 */
function parse(src){
  const list=[],byId=new Map();
  for(const p of FAMILY.people){
    const parent=p.parentId?byId.get(p.parentId):null;
    const n={id:list.length,name:p.name,gender:p.gender||'',years:p.years,spouse:p.spouse,bio:p.bio,note:p.note||'',
      depth:parent?parent.depth+1:0,parent,children:[],desc:0,x:0,y:0,vis:false};
    if(parent)parent.children.push(n);
    byId.set(p.id,n);list.push(n);
  }
  if(!list.length)return {error:'尚未录入人物'};
  for(let i=list.length-1;i>0;i--)list[i].parent.desc+=list[i].desc+1;
  return {meta:{title:FAMILY.meta.title,poem:[]},nodes:list};
}

const initialDepth=()=>FAMILY.meta.initialDepth==='auto'||FAMILY.meta.initialDepth==='all'?(innerWidth<600?2:3):Math.max(0,Number(FAMILY.meta.initialDepth)-1);
const initialExpanded=()=>new Set(nodes.filter(n=>n.children.length&&n.depth<initialDepth()).map(n=>n.id));

function load(src){
  const r=parse(src);if(r.error)return r;
  meta=r.meta;nodes=r.nodes;root=nodes[0];text=src;
  totalGens=nodes.reduce((m,n)=>Math.max(m,n.depth),0)+1;
  counts=Array(totalGens).fill(0);nodes.forEach(n=>counts[n.depth]++);
  expanded=FAMILY.meta.initialDepth==='all'?new Set(nodes.filter(n=>n.children.length).map(n=>n.id)):initialExpanded();selected=null;curGen=-1;
  nodeEls.forEach(e=>e.remove());nodeEls.clear();linkEls.forEach(e=>e.remove());linkEls.clear();
  colEls.forEach(e=>e.remove());colEls.length=0;bandEls.forEach(e=>e.remove());bandEls.length=0;
  for(let d=0;d<=totalGens;d++){
    if(d<totalGens){
      const c=document.createElement('div');c.className='col';
      c.textContent='第'+cn(d+1)+'世';colLabels.appendChild(c);colEls.push(c);
    }
    const b=document.createElement('div');b.className='band';
    b.style.left=(d*PITCH-GX/2)+'px';b.style.width=PITCH+'px';bandsEl.appendChild(b);bandEls.push(b);
  }
  $('#ttl').textContent=meta.title;document.title=[FAMILY.meta.place,meta.title].filter(Boolean).join(' · ');
  $('#sub').textContent=(FAMILY.meta.place?FAMILY.meta.place+' · ':'')+`${totalGens} 世传承 · ${nodes.length} 位族人`;
  $('#seal').textContent=Array.from(FAMILY.meta.surname||root.name)[0]||'谱';
  $('.top-note').textContent=FAMILY.meta.motto;
  measureHeader();layout();sync();if(FAMILY.meta.initialDepth==='all')fitOverview(false);else fit(false);
  return{};
}

/* ================= 布局（横向树） ================= */
function layout(){
  nodes.forEach(n=>n.vis=false);visible=[];let cur=0;maxD=0;
  (function walk(n){
    n.vis=true;if(n.depth>maxD)maxD=n.depth;
    const ks=expanded.has(n.id)?n.children:[];
    if(ks.length){ks.forEach(walk);n.y=TOP_ALIGNED?ks[0].y:(ks[0].y+ks[ks.length-1].y)/2}
    else{n.y=cur;cur+=NH+GY}
    n.x=n.depth*PITCH;visible.push(n);
  })(root);
  worldW=NW+maxD*PITCH;worldH=Math.max(NH,cur-GY);
}

function linkD(p,c){
  const x1=p.x+NW,y1=p.y+NH/2,x2=c.x,y2=c.y+NH/2,mx=(x1+x2)/2;
  return lineStyle==='straight'?`M${x1} ${y1}H${mx}V${y2}H${x2}`:`M${x1} ${y1}C${mx} ${y1} ${mx} ${y2} ${x2} ${y2}`;
}
function setLineStyle(style,remember=true){
  lineStyle=style==='curve'?'curve':'straight';
  document.documentElement.dataset.lineStyle=lineStyle;
  const straight=lineStyle==='straight',current=straight?'直线':'弧线',next=straight?'弧线':'直线';
  const label=`当前为${current}，点击切换${next}`;
  $('#lineStyle').setAttribute('aria-label',label);$('#lineStyle').title=label+(straight?'（直角连接）':'');
  $('#lineStyleText').textContent=current;
  $('#lineStyleIcon').setAttribute('d',straight?'M1 2H10V12H19':'M1 2H4C12 2 8 12 16 12H19');
  linkEls.forEach((el,id)=>{const n=nodes[id];if(n&&n.parent)el.setAttribute('d',linkD(n.parent,n));});
  if(remember){LS.set('zupu:line-style',lineStyle);if(parent!==window)parent.postMessage({type:'zupu-line-style',familyId:FAMILY.id,lineStyle},'*');}
}
$('#lineStyle').addEventListener('click',()=>{
  setLineStyle(lineStyle==='straight'?'curve':'straight');
  toast('连线已切换为'+(lineStyle==='straight'?'直线（直角连接）':'弧线'));
});

function mkNode(n){
  const el=document.createElement('div');el.className='node pop'+(n.gender==='女'?' female':'')+(n.parent?'':' root')+(n.note||fmtYears(n.years)?'':' nosub');el.dataset.id=n.id;el.style.setProperty('--h',hue(n.depth));
  el.innerHTML=`<button class="card" type="button" aria-label="${esc(n.name)}，${n.gender?esc(n.gender):'性别未填写'}，第${cn(n.depth+1)}世${n.note?'，谱注：'+esc(n.note):''}，查看详情"><div class="nm"><span class="name-text">${esc(n.name)}</span>${n.gender==='女'?'<span class="gender-mark" aria-hidden="true">女</span>':''}</div>${n.note?`<div class="sub node-note">${esc(n.note)}</div>`:(fmtYears(n.years)?`<div class="sub">${esc(fmtYears(n.years))}</div>`:'')}</button>`+(n.children.length?'<button class="tog" type="button" aria-label="展开或收起"></button>':'');
  el.querySelector('.card').title=n.name+' · '+(n.gender||'性别未填写')+' · 第'+cn(n.depth+1)+'世'+(n.note?' · 谱注：'+n.note:'');
  return el;
}

function sync(){
  if(selected!=null&&!nodes[selected].vis){selected=null;curGen=-1;if(sheetKind==='detail')closeSheet(true)}
  const path=new Set();if(selected!=null)for(let p=nodes[selected];p;p=p.parent)path.add(p.id);
  const seenN=new Set(),seenL=new Set();
  for(const n of visible){
    let el=nodeEls.get(n.id);
    if(!el){el=mkNode(n);nodeEls.set(n.id,el);nodesEl.appendChild(el)}
    seenN.add(n.id);
    el.classList.toggle('sel',n.id===selected);
    el.classList.toggle('path',path.has(n.id)&&n.id!==selected);
    const t=el.querySelector('.tog');
    if(t){const open=expanded.has(n.id);t.classList.toggle('open',open);t.textContent=open?'−':(n.desc>99?'99+':n.desc);t.setAttribute('aria-expanded',String(open));t.setAttribute('aria-label',(open?'收起':'展开')+n.name+'的后代');t.title=open?'收起此支':`展开 ${n.desc} 位后代`}
    if(n.parent){
      let l=linkEls.get(n.id);
      if(!l){l=document.createElementNS('http://www.w3.org/2000/svg','path');l.setAttribute('class','lk pop');linkEls.set(n.id,l);linksEl.appendChild(l)}
      seenL.add(n.id);l.setAttribute('d',linkD(n.parent,n));
      l.classList.toggle('hl',path.has(n.id));
    }
  }
  nodeEls.forEach((el,id)=>{if(!seenN.has(id)){el.remove();nodeEls.delete(id)}});
  linkEls.forEach((el,id)=>{if(!seenL.has(id)){el.remove();linkEls.delete(id)}});
  // Straight branches share segments; keep the selected ancestry above other lines.
  linkEls.forEach(el=>{if(el.classList.contains('hl'))linksEl.appendChild(el);});
  updateDock();apply();
}

/* ================= 视图（平移 / 缩放） ================= */
let renderedScale=-1;
function apply(){
  const vw=innerWidth,vh=innerHeight,m=70;
  view.k=clampK(view.k);
  view.x=Math.min(vw-m,Math.max(m-worldW*view.k,view.x));
  view.y=Math.min(vh-m,Math.max(m-worldH*view.k,view.y));
  // Lay out at actual display size. Text is rasterized again at every zoom level;
  // SVG lines retain their vector viewBox, rather than stretching a cached layer.
  world.style.left=pixel(view.x)+'px';world.style.top=pixel(view.y)+'px';
  const lowZoom=view.k<READ_MIN-.00001;
  world.classList.toggle('overview',lowZoom);world.classList.toggle('overview-mini',view.k<.4);
  const isOverview=overviewPinned||lowZoom;
  $('#viewHint').hidden=!isOverview;$('#viewHint').style.top=(cols.getBoundingClientRect().bottom+10)+'px';
  $('#viewHint').textContent=`${visible.length===nodes.length?'全谱':'当前分支'}总览 · ${visible.length} 人 · 点选节点放大阅读`;
  const overviewButton=dock.querySelector('[data-d="overview"]');
  overviewButton.classList.toggle('is-active',isOverview);overviewButton.setAttribute('aria-pressed',String(isOverview));
  world.style.width=worldW*view.k+'px';world.style.height=worldH*view.k+'px';
  if(renderedScale!==view.k){world.style.setProperty('--k',view.k);renderedScale=view.k;}
  for(const n of visible){const el=nodeEls.get(n.id);if(el){el.style.left=pixel(n.x*view.k)+'px';el.style.top=pixel(n.y*view.k)+'px';}}
  linksEl.setAttribute('viewBox',`0 0 ${worldW} ${worldH}`);
  linksEl.setAttribute('width',worldW*view.k);linksEl.setAttribute('height',worldH*view.k);
  bandEls.forEach((b,d)=>{
    b.style.display=d<=maxD+1?'':'none';b.classList.toggle('on',d===curGen&&d<=maxD);
    b.style.left=pixel((d*PITCH-GX/2)*view.k)+'px';b.style.width=PITCH*view.k+'px';
    b.style.top=-view.y+'px';b.style.height=vh+'px';
  });
  colEls.forEach((el,d)=>{
    const step=Math.max(1,Math.ceil(70/(PITCH*view.k)));
    const endpoint=d===0||d===maxD||d===curGen;
    if(d>maxD||(!endpoint&&(d%step!==0||(maxD-d)*PITCH*view.k<70))){el.style.display='none';return}
    el.style.display='';
    el.style.left=pixel(view.x+(d*PITCH+NW/2)*view.k)+'px';el.style.transform='translate(-50%,-50%)';
    el.classList.toggle('on',d===curGen);
  });
  const percent=view.k*100;$('#zoomValue').textContent=(percent<10?percent.toFixed(1):Math.round(percent))+'%';
  const atMinimum=view.k<=minZoom()+.00001;
  $('#zout').disabled=atMinimum;$('#zout').title=atMinimum?'已完整显示，不能继续缩小':'缩小至完整全览';$('#zin').disabled=view.k>=MAX_ZOOM-.00001;
}

function safeRect(){
  const vw=innerWidth,vh=innerHeight;
  const t=cols.getBoundingClientRect().bottom+8;
  const b=sheet.classList.contains('open')?vh-sheet.offsetHeight-8:dock.getBoundingClientRect().top-8;
  return{l:10,r:vw-10,t,b:Math.max(b,t+120)};
}
function overviewGeometry(){
  // Reserve the header, explanation and controls so no person sits under them.
  const t=cols.getBoundingClientRect().bottom+44,b=Math.max(t+40,dock.getBoundingClientRect().top-16);
  const l=20;let r=innerWidth-20;
  const zoomBox=$('#zoom').getBoundingClientRect();
  if(zoomBox.top<b&&zoomBox.bottom>t)r=Math.min(r,zoomBox.left-14);
  const aw=Math.max(40,r-l),ah=Math.max(40,b-t);
  const k=Math.max(.0001,Math.min(1,aw/Math.max(1,worldW+12),ah/Math.max(1,worldH+12)));
  return{k,x:l+(aw-worldW*k)/2,y:t+(ah-worldH*k)/2};
}
function fitOverview(animate=true){
  closeSheet(true);overviewPinned=true;
  tweenTo(overviewGeometry(),animate?420:0);
}

let tw=0,inertia=0;
function stopMotion(){cancelAnimationFrame(tw);cancelAnimationFrame(inertia)}
function tweenTo(t,dur=340){
  stopMotion();
  t.k=clampK(t.k);if(matchMedia('(prefers-reduced-motion: reduce)').matches)dur=0;
  if(!dur){view={x:t.x,y:t.y,k:t.k};apply();return}
  const s={...view},t0=performance.now();
  const step=now=>{
    let p=Math.min(1,(now-t0)/dur);p=1-Math.pow(1-p,3);
    view={x:s.x+(t.x-s.x)*p,y:s.y+(t.y-s.y)*p,k:s.k+(t.k-s.k)*p};apply();
    if(p<1)tw=requestAnimationFrame(step);
  };
  tw=requestAnimationFrame(step);
}
function fit(animate=true){
  overviewPinned=false;
  const R=safeRect(),aw=R.r-R.l,ah=R.b-R.t;
  // Reset to a readable native size. Large pedigrees remain pannable.
  const k=1;
  const x=worldW*k<=aw?R.l+(aw-worldW*k)/2:R.l+4;
  const y=worldH*k<=ah?R.t+(ah-worldH*k)/2:(TOP_ALIGNED?R.t+16:R.t+ah/2-(root.y+NH/2)*k);
  tweenTo({x,y,k},animate?360:0);
}
function centerOn(n){
  overviewPinned=false;
  const R=safeRect(),k=Math.max(view.k,1);
  tweenTo({k,x:R.l+(R.r-R.l)*.3-(n.x+NW/2)*k,y:(R.t+R.b)/2-(n.y+NH/2)*k},380);
}
function reveal(r,keep){
  const R=safeRect(),k=view.k;let dx=0,dy=0;
  const sx0=view.x+r.x0*k,sx1=view.x+r.x1*k,sy0=view.y+r.y0*k,sy1=view.y+r.y1*k;
  if(sx1>R.r)dx=R.r-sx1;if(sx0+dx<R.l)dx=R.l-sx0;
  if(sy1>R.b)dy=R.b-sy1;if(sy0+dy<R.t)dy=R.t-sy0;
  if(keep){
    const ky0=view.y+keep.y0*k+dy,ky1=view.y+keep.y1*k+dy,kx0=view.x+keep.x0*k+dx,kx1=view.x+keep.x1*k+dx;
    if(ky1>R.b)dy-=ky1-R.b;if(ky0<R.t)dy+=R.t-ky0;
    if(kx1>R.r)dx-=kx1-R.r;if(kx0<R.l)dx+=R.l-kx0;
  }
  if(Math.abs(dx)>1||Math.abs(dy)>1)tweenTo({x:view.x+dx,y:view.y+dy,k},320);
}
const nodeRect=n=>({x0:n.x-4,y0:n.y-4,x1:n.x+NW+24,y1:n.y+NH+4});
function subtreeRect(n){
  const r={x0:n.x-4,y0:n.y-4,x1:n.x+NW+24,y1:n.y+NH+4};
  (function w(m){if(m.vis){r.x1=Math.max(r.x1,m.x+NW+24);r.y0=Math.min(r.y0,m.y-4);r.y1=Math.max(r.y1,m.y+NH+4)}
    if(expanded.has(m.id))m.children.forEach(w)})(n);
  return r;
}
function zoomBy(direction){
  overviewPinned=false;
  const next=direction>0?(Math.floor(view.k*4+.00001)+1)/4:(Math.ceil(view.k*4-.00001)-1)/4;
  const step=view.k<READ_MIN?view.k*(direction>0?1.5:1/1.5):next;
  const R=safeRect(),cx=(R.l+R.r)/2,cy=(R.t+R.b)/2,nk=clampK(step);
  if(nk<=minZoom()+.00001){fitOverview();return;}
  if(Math.abs(nk-view.k)<.00001)return;
  const wx=(cx-view.x)/view.k,wy=(cy-view.y)/view.k;
  tweenTo({k:nk,x:cx-wx*nk,y:cy-wy*nk},220);
}

/* ================= 展开 / 收起 ================= */
function mutate(n,fn){
  overviewPinned=false;
  const sx=view.x+n.x*view.k,sy=view.y+n.y*view.k;
  fn();layout();view.x=sx-n.x*view.k;view.y=sy-n.y*view.k;sync();
}
function toggle(id){
  const n=nodes[id];if(!n.children.length)return;
  const opening=!expanded.has(id);
  mutate(n,()=>{opening?expanded.add(id):expanded.delete(id)});
  if(opening)reveal(TOP_ALIGNED?nodeRect(n.children[0]):subtreeRect(n),nodeRect(n));
  if(sheetKind==='detail'&&selected===id)openDetail(n);
}
function expandBranch(n){
  mutate(n,()=>{(function d(m){if(m.children.length)expanded.add(m.id);m.children.forEach(d)})(n)});
  reveal(TOP_ALIGNED&&n.children.length?nodeRect(n.children[0]):subtreeRect(n),nodeRect(n));openDetail(n);
}
function collapseBranch(n){mutate(n,()=>expanded.delete(n.id));openDetail(n)}
function toggleAll(){
  const all=nodes.every(n=>!n.children.length||expanded.has(n.id));
  expanded=all?initialExpanded():new Set(nodes.filter(n=>n.children.length).map(n=>n.id));
  closeSheet();selected=null;curGen=-1;layout();sync();if(all)fit();else fitOverview();
  toast(all?'已收起到前'+cn(initialDepth()+1)+'世':'已展开全部 '+totalGens+' 世，点选节点即可放大阅读');
}
function updateDock(){
  const all=nodes.every(n=>!n.children.length||expanded.has(n.id));
  $('#allIcon').innerHTML=all?ICON_COLLAPSE:ICON_EXPAND;$('#allTxt').textContent=all?'收起':'展开';
}
function jumpGen(d){
  overviewPinned=false;
  expanded=new Set(nodes.filter(n=>n.children.length&&n.depth<d).map(n=>n.id));
  selected=null;closeSheet(true);curGen=d;layout();sync();
  const col=visible.filter(n=>n.depth===d);if(!col.length)return;
  const top=Math.min(...col.map(n=>n.y)),bot=Math.max(...col.map(n=>n.y))+NH;
  const R=safeRect(),k=Math.min(1,Math.max(view.k,.75));
  const x=R.l+4-(Math.max(0,d-1)*PITCH)*k;
  const y=(bot-top)*k<=R.b-R.t?(R.t+R.b)/2-((top+bot)/2)*k:R.t-top*k+6;
  tweenTo({x,y,k},420);
}

/* ================= 选择 / 详情 ================= */
function showNode(id,o={}){
  const fromOverview=view.k<READ_MIN;overviewPinned=false;
  const n=nodes[id];let ch=false;
  for(let p=n.parent;p;p=p.parent)if(!expanded.has(p.id)){expanded.add(p.id);ch=true}
  if(ch)layout();
  selected=id;curGen=n.depth;sync();openDetail(n);
  requestAnimationFrame(()=>o.center===false&&!fromOverview?reveal(subtreeRectOne(n),nodeRect(n)):centerOn(n));
}
const subtreeRectOne=n=>nodeRect(n);

function chip(n,cur){
  return cur?`<span class="chip cur" style="--h:${hue(n.depth)}">${esc(n.name)}</span>`
    :`<button class="chip" data-go="${n.id}" style="--h:${hue(n.depth)}">${esc(n.name)}</button>`;

function openDetail(n){

  if(rows.length)h+=`<dl class="info">${rows.map(r=>`<dt>${r[0]}</dt><dd>${r[1]}</dd>`).join('')}</dl>`;
  if(path.length)h+=`<div class="sec">世系</div><div class="chips" id="pathChips">${path.map(p=>chip(p)+'<span class="arr">›</span>').join('')}${chip(n,true)}</div>`;
  if(n.children.length)h+=`<div class="sec">子女</div><div class="chips wrap">${n.children.map(c=>chip(c)).join('')}</div>`;

/* ================= 底部面板 ================= */
function openSheet(kind,html,o={}){
  overviewPinned=false;
  if(sheetKind==='detail'&&kind!=='detail'){selected=null;curGen=-1;sync()}
  sheetKind=kind;sheet.inert=false;sheet.setAttribute('aria-modal',o.modal?'true':'false');body.innerHTML=html;
  sheet.classList.toggle('peek',!!o.peek);sheet.classList.add('open');

}
function closeSheet(silent){
  if(!sheet.classList.contains('open'))return;
  sheet.classList.remove('open');sheet.inert=true;mask.classList.remove('on');
  const was=sheetKind;sheetKind=null;

function openSearch(){
  openSheet('search',`<div class="sh-head"><h2 class="sh-title">寻一个名字</h2><button class="x" data-act="close" aria-label="关闭查找">✕</button></div><input id="q" type="search" placeholder="搜索姓名、谱注、配偶或生平…" aria-label="搜索族人" autocomplete="off" enterkeyhint="search"><div id="res"></div>`,{modal:true});
  const q=$('#q');q.addEventListener('input',()=>doSearch(q.value));doSearch('');
  setTimeout(()=>q.focus(),360);
}
function doSearch(v){
  v=v.trim();const out=$('#res');
  if(!v){out.innerHTML=`<p class="hint">共收录 ${nodes.length} 人。输入姓名、谱注、配偶或生平关键词，沿着一个名字，找到这位族人的来路。</p>`;return}
  const hit=nodes.filter(n=>(n.name+n.note+n.spouse+n.bio).includes(v));
  if(!hit.length){out.innerHTML=`<p class="hint">没有找到“${esc(v)}”。换个字再试试？</p>`;return}
  const mk=s=>esc(s).split(esc(v)).join(`<mark>${esc(v)}</mark>`);
  out.innerHTML=`<p class="hint" style="margin:10px 2px 2px">找到 ${hit.length} 人${hit.length>60?'，仅显示前 60 位':''}</p>`+
    hit.slice(0,60).map(n=>`<button class="res" data-go="${n.id}" style="--h:${hue(n.depth)}"><b>${mk(n.name)}</b><span>第${cn(n.depth+1)}世</span><em>${esc(fmtYears(n.years))}</em></button>`).join('');
}
function openGen(){
  const total=Math.ceil(Math.max(totalGens,5)/5)*5;
  let g='';
  for(let d=0;d<total;d++){
    const has=d<totalGens;
    g+=`<button data-gen="${d}" style="--h:${hue(d)}" ${has?'':'disabled'} class="${has&&d<=maxD?'vis':''} ${d===curGen?'cur':''}"><b>${cn(d+1)}世</b><i>${has?counts[d]+'人':'—'}</i></button>`;
  }
  openSheet('gen',`<div class="sh-head"><h2 class="sh-title">一世一续，绵延有章。</h2><button class="x" data-act="close" aria-label="关闭世代">✕</button></div><p class="hint" style="margin:0 2px 10px">点选某一世，展开并跳转到该世。</p><div class="gg">${g}</div>`,{modal:true});
}
function act(a,el){
  const n=el&&el.dataset.id!=null?nodes[+el.dataset.id]:null;

  else if(a==='expand')expandBranch(n);

  else if(a==='root')showNode(root.id);
}
body.addEventListener('click',e=>{
  const g=e.target.closest('[data-go]');if(g){showNode(+g.dataset.go);return}
  const a=e.target.closest('[data-act]');if(a){act(a.dataset.act,a);return}

mask.addEventListener('click',()=>closeSheet());
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});
/* 下拉关闭 */
(()=>{
  const grip=$('#grip');let y0=null,dy=0;
  grip.addEventListener('pointerdown',e=>{y0=e.clientY;dy=0;grip.setPointerCapture(e.pointerId);sheet.style.transition='none'});
  grip.addEventListener('pointermove',e=>{if(y0==null)return;dy=Math.max(0,e.clientY-y0);sheet.style.transform=`translate(-50%,${dy}px)`});
  const end=()=>{if(y0==null)return;y0=null;sheet.style.transition='';sheet.style.transform='';if(dy>70)closeSheet()};
  grip.addEventListener('pointerup',end);grip.addEventListener('pointercancel',end);

/* ================= 手势 ================= */
const ptrs=new Map();let down=null,pinch=null,vel={x:0,y:0},lastT=0;
vp.addEventListener('pointerdown',e=>{
  if(e.pointerType==='mouse'&&e.button!==0)return;
  overviewPinned=false;stopMotion();vp.setPointerCapture(e.pointerId);
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===1){down={x:e.clientX,y:e.clientY,target:e.target,moved:false};vel={x:0,y:0};lastT=e.timeStamp}
  else{if(down)down.moved=true;startPinch()}
});
function startPinch(){
  vel={x:0,y:0};
  const [a,b]=[...ptrs.values()];
  pinch={d:Math.hypot(a.x-b.x,a.y-b.y)||1,k:view.k,wx:((a.x+b.x)/2-view.x)/view.k,wy:((a.y+b.y)/2-view.y)/view.k};
}
vp.addEventListener('pointermove',e=>{
  const p=ptrs.get(e.pointerId);if(!p)return;
  if(ptrs.size===1&&down){
    const dx=e.clientX-p.x,dy=e.clientY-p.y;p.x=e.clientX;p.y=e.clientY;
    if(!down.moved&&Math.hypot(e.clientX-down.x,e.clientY-down.y)>7){down.moved=true;vp.classList.add('drag')}
    if(down.moved){
      view.x+=dx;view.y+=dy;apply();
      const dt=Math.max(1,e.timeStamp-lastT);lastT=e.timeStamp;
      vel.x=.6*vel.x+.4*dx/dt;vel.y=.6*vel.y+.4*dy/dt;
    }
  }else if(ptrs.size===2&&pinch){
    p.x=e.clientX;p.y=e.clientY;
    const [a,b]=[...ptrs.values()],d=Math.hypot(a.x-b.x,a.y-b.y),k=clampK(pinch.k*d/pinch.d);
    if(k<=minZoom()+.00001){closeSheet(true);overviewPinned=true;view=overviewGeometry();}
    else{overviewPinned=false;view.k=k;view.x=(a.x+b.x)/2-pinch.wx*k;view.y=(a.y+b.y)/2-pinch.wy*k;}
    apply();
  }
});
function endPtr(e,cancel){
  if(!ptrs.has(e.pointerId))return;
  ptrs.delete(e.pointerId);vp.classList.remove('drag');
  if(ptrs.size===0){
    const d=down;down=null;pinch=null;
    if(!d||cancel)return;
    if(!d.moved)tap(d.target,{x:d.x,y:d.y});
    else if(e.timeStamp-lastT<90&&Math.hypot(vel.x,vel.y)>.12)fling(vel.x,vel.y);
  }else if(ptrs.size===1){pinch=null;const r=[...ptrs.values()][0];if(down)down.moved=true;r.x=r.x}
}
vp.addEventListener('pointerup',e=>endPtr(e,false));
vp.addEventListener('pointercancel',e=>endPtr(e,true));
vp.addEventListener('lostpointercapture',e=>endPtr(e,true));
vp.addEventListener('click',e=>{if(e.detail===0)tap(e.target)});
function fling(vx,vy){
  let last=performance.now();
  const step=now=>{
    const dt=Math.min(32,now-last);last=now;
    view.x+=vx*dt;view.y+=vy*dt;const f=Math.pow(.94,dt/16);vx*=f;vy*=f;apply();
    if(Math.hypot(vx,vy)>.02)inertia=requestAnimationFrame(step);
  };
  inertia=requestAnimationFrame(step);
}
function tap(t,point){
  if(!t||!t.closest)return;
  const nd=t.closest('.node');
  if(nd){
    if(t.closest('.tog'))toggle(+nd.dataset.id);
    else showNode(+nd.dataset.id,{center:false});
    return;
  }
  if(view.k<READ_MIN&&point){
    let nearest=null,distance=24;
    for(const n of visible){const d=Math.hypot(view.x+(n.x+NW/2)*view.k-point.x,view.y+(n.y+NH/2)*view.k-point.y);if(d<distance){distance=d;nearest=n;}}
    if(nearest){showNode(nearest.id);return;}
  }
  if(sheetKind==='detail')closeSheet();
}
vp.addEventListener('wheel',e=>{
  e.preventDefault();overviewPinned=false;stopMotion();
  const nk=clampK(view.k*Math.exp(-e.deltaY*(e.ctrlKey?.01:.0015)));
  if(nk<=minZoom()+.00001){fitOverview(false);return;}
  if(Math.abs(nk-view.k)<.00001)return;
  const wx=(e.clientX-view.x)/view.k,wy=(e.clientY-view.y)/view.k;
  view.k=nk;view.x=e.clientX-wx*nk;view.y=e.clientY-wy*nk;apply();
},{passive:false});
addEventListener('resize',()=>{measureHeader();stopMotion();if(overviewPinned)fitOverview(false);else apply();});
new ResizeObserver(()=>{if(measureHeader()&&nodes.length){stopMotion();if(overviewPinned)fitOverview(false);else apply();}}).observe($('#top'));

/* Fullscreen requires a user gesture; unsupported browsers get home-screen guidance. */
const standaloneMode=matchMedia('(display-mode: standalone)');
const fullscreenActive=()=>!!(document.fullscreenElement||document.webkitFullscreenElement);
function syncFullscreen(){
  const active=fullscreenActive(),button=$('#fullscreen');
  button.hidden=!active&&(standaloneMode.matches||navigator.standalone===true);
  button.textContent=active?'退出':'全屏';
  button.setAttribute('aria-pressed',String(active));
  button.setAttribute('aria-label',active?'退出全屏':'进入全屏');
  button.title=active?'退出全屏':'全屏浏览；不支持时查看主屏幕打开方式';
  if(nodes.length){measureHeader();stopMotion();if(overviewPinned)fitOverview(false);else apply();}
}
function openFullscreenHelp(){
  openSheet('fullscreen',`<div class="sh-head"><h2 class="sh-title">让族谱占满屏幕</h2><button class="x" data-act="close" aria-label="关闭全屏说明">✕</button></div>
    <p class="hint">当前浏览器未支持或未允许网页全屏。普通网页不能强制隐藏浏览器地址栏。</p>
    <div class="sec">iPhone / iPad</div>
    <p class="hint">用 Safari 打开本页，点“分享” → “添加到主屏幕”。如果出现“作为网页 App 打开”，请保持开启。以后从主屏幕图标进入，就能省去地址栏。</p>
    <div class="sec">安卓手机</div>
    <p class="hint">建议用 Chrome 或 Edge 打开，再点右侧“全屏”。如果是在微信等应用内浏览，请先通过菜单选择“在浏览器中打开”。是否能进入全屏取决于浏览器支持。</p>`,{modal:true});
}
$('#fullscreen').addEventListener('click',async()=>{
  const active=fullscreenActive(),target=active?document:document.documentElement;
  const action=active?(document.exitFullscreen||document.webkitExitFullscreen):(target.requestFullscreen||target.webkitRequestFullscreen);
  if(!action){openFullscreenHelp();return;}
  closeSheet(true);
  try{
    if(!active&&target.requestFullscreen)await target.requestFullscreen({navigationUI:'hide'});
    else await action.call(target);
    syncFullscreen();
  }catch(e){
    if(active)toast('可使用浏览器的退出全屏操作，或按 Esc 退出');
    else openFullscreenHelp();
  }
});
document.addEventListener('fullscreenchange',syncFullscreen);
document.addEventListener('webkitfullscreenchange',syncFullscreen);
standaloneMode.addEventListener?.('change',syncFullscreen);

function setTheme(t){
  const index=Math.max(0,THEMES.findIndex(theme=>theme.id===t)),current=THEMES[index],next=THEMES[(index+1)%THEMES.length];
  const anchor=nodes.length?nodes[selected]||root:null;
  const screen=anchor?{x:view.x+(anchor.x+NW/2)*view.k,y:view.y+(anchor.y+NH/2)*view.k}:null;
  stopMotion();
  document.documentElement.dataset.theme=current.id;
  $('#theme').innerHTML=current.icon;
  document.querySelector('meta[name=theme-color]').content=current.color;
  const label=`当前为${current.name}主题，点击切换${next.name}主题`;
  $('#theme').setAttribute('aria-label',label);$('#theme').title=label;
  LS.set('zupu:theme',current.id);
  measureHeader();
  if(anchor){
    layout();view.x=screen.x-(anchor.x+NW/2)*view.k;view.y=screen.y-(anchor.y+NH/2)*view.k;sync();
    if(overviewPinned)fitOverview(false);
  }
}
$('#theme').addEventListener('click',()=>{
  const index=THEMES.findIndex(theme=>theme.id===document.documentElement.dataset.theme),next=THEMES[(index+1)%THEMES.length];
  setTheme(next.id);toast(`已切换为${next.name}主题`);
});
let tt=0;
function toast(s,ms=2200){toastEl.textContent=s;toastEl.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>toastEl.classList.remove('on'),ms)}

/* ================= 启动 ================= */
const editedAt=$('#editedAt');editedAt.dateTime=LAST_EDITED;
editedAt.textContent=new Intl.DateTimeFormat('zh-CN',{timeZone:'Asia/Shanghai',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).format(new Date(LAST_EDITED)).replace(/\//g,'-');
editedAt.title='北京时间 · 文件最后编辑时间';
setHeaderHidden(LS.get('zupu:header-hidden')==null?FAMILY.meta.headerHidden:LS.get('zupu:header-hidden')==='1',false);
setTheme(LS.get('zupu:theme')||FAMILY.meta.theme);
setLineStyle(LS.get('zupu:line-style')||DEFAULT_LINE_STYLE,false);
const r=load(SAMPLE);
syncFullscreen();
if(r.error)document.body.insertAdjacentHTML('beforeend','<p style="padding:80px 20px">族谱数据有误：'+r.error+'</p>');
if(!LS.get('zupu:seen:refined')){setTimeout(()=>toast('单指拖动 · 双指缩放 · 点名字查看记载',4600),500);LS.set('zupu:seen:refined','1')}
})();
</script>
