<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>Favicon · H 定稿</title>
<style>
  body { font-family: system-ui; background: #F5F1E8; color: #1C1A16; padding: 40px; }
  h1 { font-size: 20px; margin-bottom: 8px; }
  p { color: #666; margin-bottom: 32px; }
  .card { background: #fff; border: 1px solid #ddd; border-radius: 12px; padding: 24px; text-align: center; max-width: 320px; }
  .sizes { display: flex; align-items: flex-end; justify-content: center; gap: 16px; margin-top: 16px; padding-top: 16px; border-top: 1px dashed #ddd; }
  .sizes span { font-size: 10px; color: #aaa; display: block; text-align: center; }
  svg { display: block; }
</style>
</head>
<body>
<h1>Favicon · H 定稿</h1>
<p>三竖等宽 · 左双竖紧 · 右间距开 · 左双竖无横 · 主题色。</p>

<div class="card">
  <div class="preview">
    <svg width="128" height="128" viewBox="0 0 64 64">
      <rect width="64" height="64" rx="12" fill="#F5F1E8"/>
      <g fill="#1C1A16">
        <rect x="15" y="16" width="3" height="32"/>
        <rect x="20" y="16" width="4" height="32"/>
        <rect x="45" y="16" width="4" height="32"/>
        <rect x="25" y="30" width="20" height="4"/>
      </g>
    </svg>
  </div>
  <div class="sizes">
    <div><svg width="32" height="32" viewBox="0 0 64 64"><rect width="64" height="64" rx="12" fill="#F5F1E8"/><g fill="#1C1A16"><rect x="15" y="16" width="3" height="32"/><rect x="20" y="16" width="4" height="32"/><rect x="45" y="16" width="4" height="32"/><rect x="25" y="30" width="20" height="4"/></g></svg><span>32</span></div>
    <div><svg width="16" height="16" viewBox="0 0 64 64"><rect width="64" height="64" rx="12" fill="#F5F1E8"/><g fill="#1C1A16"><rect x="15" y="16" width="3" height="32"/><rect x="20" y="16" width="4" height="32"/><rect x="45" y="16" width="4" height="32"/><rect x="25" y="30" width="20" height="4"/></g></svg><span>16</span></div>
  </div>
</div>
</body>
</html>
